plugins {
    id 'net.minecraftforge.gradle' version '6.+'   // ForgeGradle for 1.20.x
    id 'eclipse'
    id 'maven-publish'
}

version = project.mod_version
group = 'net.mystic.wallpapercraft'
archivesBaseName = "${project.name}-${project.minecraft_version}"

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

minecraft {
    // 1.20.1 official mappings
    mappings channel: 'official', version: project.minecraft_version
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods { wallpapercraft { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods { wallpapercraft { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'wallpapercraft', '--all', '--output', file('src/generated/resources/')
            mods { wallpapercraft { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { name = "Progwml6";  url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" } // JEI
    maven { name = "ModMaven";   url = "https://modmaven.dev" }
    maven { url = "https://maven.minecraftforge.net" }
    mavenCentral()
}

dependencies {
    // Forge (1.20.1 = 47.x line)
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // JEI for 1.20.1 — use API at compile time, full mod at runtime
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${project.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${project.jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-gui:${project.jei_version}")
    runtimeOnly  fg.deobf("mezz.jei:jei-1.20.1-forge:${project.jei_version}")
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    archives tasks.named('sourcesJar')
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "wallpapercraft",
                "Specification-Vendor"    : "Mysticpasta1",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Mysticpasta1",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Reobfuscate the main jar
jar.finalizedBy('reobfJar')

// Publish reobf'd jar + sources
def reobfFile = file("$buildDir/reobfJar/output.jar")
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
    builtBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact reobfArtifact
            artifact tasks.named('sourcesJar')
        }
    }
    repositories {
        maven { url 'file:../mcmodsrepo' }
    }
}
