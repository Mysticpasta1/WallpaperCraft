plugins {
    id 'net.minecraftforge.gradle' version '5.1.+'
    id 'eclipse'
    id 'maven-publish'
}

version = project.mod_version
group = 'net.mystic.wallpapercraft'
archivesBaseName = "${project.name}-${project.minecraft_version}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    // Use official mappings to keep this simple
    mappings channel: 'official', version: project.minecraft_version

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                wallpapercraft { source sourceSets.main }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                wallpapercraft { source sourceSets.main }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'wallpapercraft', '--all', '--output', file('src/generated/resources/')

            mods {
                wallpapercraft { source sourceSets.main }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { name = "Progwml6";  url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "ModMaven";   url = "https://modmaven.dev" }
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // JEI API (compileOnly) + full mod at runtime
    compileOnly fg.deobf("mezz.jei:jei-1.19.2-common-api:11.8.1.1034")
    compileOnly fg.deobf("mezz.jei:jei-1.19.2-forge-api:11.8.1.1034")
    compileOnly fg.deobf("mezz.jei:jei-1.19.2-gui:11.8.1.1034")

    runtimeOnly fg.deobf("mezz.jei:jei-1.19.2-forge:11.8.1.1034")
}

tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

artifacts {
    archives tasks.named('sourcesJar')
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "wallpapercraft",
                "Specification-Vendor"    : "Mysticpasta1",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Mysticpasta1",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Reobfuscate the main jar
jar.finalizedBy('reobfJar')

// Publish reobf'd jar + sources
def reobfFile = file("$buildDir/reobfJar/output.jar")
def reobfArtifact = artifacts.add('default', reobfFile) {
    type 'jar'
    builtBy 'reobfJar'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact reobfArtifact
            artifact tasks.named('sourcesJar')
        }
    }
    repositories {
        maven {
            url 'file:../mcmodsrepo'
        }
    }
}
